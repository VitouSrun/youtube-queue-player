<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- iOS & Android PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT Queue">
    <meta name="theme-color" content="#020617">

    <title>YouTube Queue Player</title>

    <!-- Static Manifest & Apple Touch Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        input {
            -webkit-user-select: text;
            user-select: text;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col md:flex-row min-h-screen md:h-screen overflow-y-auto md:overflow-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-6 right-5 left-5 sm:left-auto z-50 flex flex-col items-end space-y-2 pointer-events-none"></div>

    <!-- Hidden File Input for Queue Import -->
    <input type="file" id="import-queue-input" accept="application/json" class="hidden" onchange="handleImportQueue(event)">

    <!-- Left/Top Column: Video Player & Controls -->
    <div id="player-section" class="w-full md:w-3/5 lg:w-2/3 flex flex-col shrink-0 md:h-full bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 p-3 sm:p-6 md:overflow-y-auto">
        <header class="flex items-center justify-between mb-3 sm:mb-4">
            <div class="flex items-center space-x-2.5">
                <div class="bg-red-600 text-white p-2 rounded-xl shadow-lg shadow-red-600/30 flex items-center justify-center">
                    <i class="fa-brands fa-youtube text-lg sm:text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white leading-tight">YT Queue Streamer</h1>
                        <button type="button" id="appVersionBtn" class="inline-flex items-center px-1.5 py-0.5 rounded font-mono text-[10px] font-semibold bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 hover:border-red-500/40 transition-all cursor-pointer active:scale-95" title="App Version (Click to check for updates)">
                            <span id="appVersionText">v1.9.0</span>
                        </button>
                    </div>
                    <p class="text-[11px] sm:text-xs text-slate-400">Seamless playback & shared queue</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button type="button" onclick="scrollToQueue()" class="md:hidden inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors active:scale-95" title="Jump to Queue">
                    <i class="fa-solid fa-list-ul text-red-500"></i>
                    <span id="mobile-header-queue-count">0 items</span>
                </button>
                <span class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                    Live Player
                </span>
            </div>
        </header>

        <!-- Update Notification Banner (Hidden until Service Worker finds update) -->
        <div id="updateBanner" class="hidden mb-3 p-2.5 sm:p-3 bg-gradient-to-r from-red-950/80 to-slate-900 border border-red-500/40 rounded-xl shadow-lg items-center justify-between gap-3 animate-fadeIn" role="alert">
            <div class="flex items-center space-x-2 text-xs sm:text-sm font-medium text-slate-200">
                <i class="fa-solid fa-arrows-rotate text-red-400 shrink-0"></i>
                <span>New update available!</span>
            </div>
            <button id="updateBtn" type="button" class="px-3 py-1 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-lg shadow-md shadow-red-600/30 transition-all shrink-0 active:scale-95">
                Reload
            </button>
        </div>

        <!-- Player Container -->
        <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 group">
            <div id="youtube-player" class="w-full h-full absolute inset-0"></div>
            <!-- Dynamic Overlay for Autoplay / Embed Restrictions -->
            <div id="click-to-play-overlay" onclick="retryPlayback()" class="absolute inset-0 bg-slate-950/85 backdrop-blur-sm flex flex-col items-center justify-center p-5 text-center cursor-pointer transition-all duration-300 opacity-0 pointer-events-none z-20"></div>
            <!-- Empty State Overlay -->
            <div id="player-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 text-slate-400 p-6 text-center transition-opacity duration-300 z-10">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center mb-3 text-slate-500 group-hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-play text-xl sm:text-2xl ml-1"></i>
                </div>
                <h3 class="text-sm font-semibold text-slate-200 mb-1">Queue is currently empty</h3>
                <p class="text-xs text-slate-500 max-w-xs">Add a YouTube link below to start playback automatically.</p>
            </div>
        </div>

        <!-- Now Playing & Controls -->
        <div class="mt-3 sm:mt-4 bg-slate-950/60 rounded-xl p-3 sm:p-4 border border-slate-800/80">
            <div class="flex items-center justify-between">
                <div class="min-w-0 flex-1 pr-3">
                    <div class="text-[10px] font-medium text-slate-400 uppercase tracking-wider">Now Playing</div>
                    <h2 id="current-title" class="text-xs sm:text-sm font-semibold text-white truncate mt-0.5">No video playing</h2>
                </div>
                <div class="flex items-center space-x-1 shrink-0 font-mono text-[11px] text-slate-400">
                    <span id="current-time">0:00</span>
                    <span class="text-slate-600">/</span>
                    <span id="current-duration">--:--</span>
                </div>
            </div>

            <!-- Interactive Scrubber / Seek Bar -->
            <div class="mt-2.5 flex items-center space-x-2">
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1"
                    aria-label="Playback progress scrubber"
                    onmousedown="isSeeking = true"
                    onmouseup="finishSeek(this.value)"
                    ontouchstart="isSeeking = true"
                    ontouchend="finishSeek(this.value)"
                    oninput="updateSeekDisplay(this.value)"
                    class="w-full accent-red-600 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
            </div>

            <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <button onclick="playPrevious()" aria-label="Previous track" title="Previous Video" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all active:scale-95">
                        <i class="fa-solid fa-backward-step text-xs sm:text-sm"></i>
                    </button>
                    <button onclick="togglePlayPause()" id="play-pause-btn" aria-label="Play or pause" title="Play / Pause" class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-red-600 hover:bg-red-500 text-white flex items-center justify-center transition-all shadow-lg shadow-red-600/30 active:scale-95">
                        <i class="fa-solid fa-play ml-0.5 text-sm sm:text-base" id="play-pause-icon"></i>
                    </button>
                    <button onclick="playNext()" aria-label="Next track" title="Skip to Next" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition-all active:scale-95">
                        <i class="fa-solid fa-forward-step text-xs sm:text-sm"></i>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <div class="hidden sm:flex items-center space-x-2 mr-2">
                        <button onclick="toggleMute()" id="mute-btn" aria-label="Mute or unmute volume" class="text-slate-400 hover:text-white transition-colors p-1"><i class="fa-solid fa-volume-high text-xs"></i></button>
                        <input type="range" id="volume-slider" min="0" max="100" value="100" aria-label="Volume slider" oninput="setVolume(this.value)" class="w-20 accent-red-600 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
                    </div>
                    <button onclick="toggleLoop()" id="loop-btn" aria-label="Toggle loop queue" title="Toggle Loop Queue" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all active:scale-95">
                        <i class="fa-solid fa-rotate-right text-xs sm:text-sm"></i>
                    </button>
                    <button onclick="clearQueueCompletely()" aria-label="Clear entire queue" title="Clear Entire Queue" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition-all active:scale-95">
                        <i class="fa-solid fa-trash-can text-xs sm:text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Right/Bottom Column: Queue Management -->
    <div id="queue-section" class="w-full md:w-2/5 lg:w-1/3 flex flex-col md:flex-1 md:min-h-0 md:h-full bg-slate-950 p-3 sm:p-6 pb-24 md:pb-6 overflow-visible md:overflow-hidden">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm sm:text-base font-bold text-white flex items-center space-x-2">
                <i class="fa-solid fa-list-ul text-red-500"></i>
                <span>Playback Queue</span>
            </h2>
            <div class="flex items-center space-x-2">
                <span id="queue-count" class="text-xs px-2.5 py-0.5 bg-slate-800 text-slate-300 rounded-full font-medium border border-slate-700">0 items</span>
            </div>
        </div>

        <form id="add-video-form" onsubmit="addVideoToQueue(event)" class="space-y-2.5 mb-3 shrink-0">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                    <i class="fa-solid fa-link text-sm"></i>
                </div>
                <input type="text" id="video-url-input" placeholder="Paste YouTube link or ID..." 
                    class="w-full pl-9 pr-20 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-base sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition-all shadow-inner">
                <button type="submit" aria-label="Add video to queue" class="absolute right-1.5 top-1.5 bottom-1.5 px-3.5 bg-red-600 hover:bg-red-500 text-white font-medium text-xs rounded-lg transition-all shadow-md shadow-red-600/20 active:scale-95 flex items-center space-x-1">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add</span>
                </button>
            </div>
            <div class="flex items-center space-x-2">
                <button type="button" onclick="loadSamplePlaylist()" aria-label="Load demo queue" class="flex-1 py-2 px-3 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-medium border border-slate-800 transition-all flex items-center justify-center space-x-1.5 active:scale-95">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                    <span>Demo Queue</span>
                </button>
                <button type="button" onclick="clearQueueCompletely()" id="toolbar-clear-all-btn" aria-label="Clear all queue items" class="py-2 px-3 bg-slate-900 hover:bg-rose-950/50 text-slate-300 hover:text-rose-400 rounded-xl text-xs font-medium border border-slate-800 hover:border-rose-500/40 transition-all flex items-center justify-center space-x-1.5 active:scale-95" title="Clear All Queue Items">
                    <i class="fa-solid fa-trash-can text-rose-400"></i>
                    <span>Clear All</span>
                </button>
                <button type="button" onclick="document.getElementById('import-queue-input').click()" aria-label="Import queue from JSON" class="py-2 px-2.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-medium border border-slate-800 transition-all flex items-center justify-center" title="Import Queue JSON">
                    <i class="fa-solid fa-upload"></i>
                </button>
                <button type="button" onclick="exportQueue()" aria-label="Export queue to JSON" class="py-2 px-2.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-medium border border-slate-800 transition-all flex items-center justify-center" title="Export Queue JSON">
                    <i class="fa-solid fa-download"></i>
                </button>
            </div>
        </form>

        <div id="queue-container" class="space-y-2 pr-1 md:flex-1 md:overflow-y-auto md:min-h-0"></div>
    </div>

    <!-- Mobile Floating Mini-Player Bar -->
    <div id="mobile-mini-player" class="fixed bottom-3 inset-x-3 sm:inset-x-6 z-40 md:hidden bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-2xl p-2.5 shadow-2xl flex items-center justify-between transition-all duration-300 translate-y-28 opacity-0 pointer-events-none">
        <div class="flex items-center space-x-2.5 min-w-0 flex-1 cursor-pointer" onclick="scrollToPlayer()">
            <div class="relative w-11 h-8 rounded-lg overflow-hidden shrink-0 bg-slate-800 border border-slate-700 flex items-center justify-center">
                <img id="mini-thumbnail" src="https://placehold.co/120x90/1e293b/64748b?text=YT" onerror="this.src='https://placehold.co/120x90/1e293b/64748b?text=YT'" class="w-full h-full object-cover" alt="Now Playing">
                <div id="mini-wave" class="absolute inset-0 bg-red-600/30 flex items-center justify-center opacity-0 transition-opacity">
                    <i class="fa-solid fa-volume-high text-white text-[10px] animate-pulse"></i>
                </div>
            </div>
            <div class="min-w-0 flex-1">
                <div id="mini-title" class="text-xs font-semibold text-white truncate">No video playing</div>
                <div class="text-[10px] text-slate-400 flex items-center space-x-1">
                    <span id="mini-time">0:00</span>
                    <span class="text-slate-600">/</span>
                    <span id="mini-duration">--:--</span>
                    <span class="text-slate-600">•</span>
                    <span class="text-red-400 font-medium">View player</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-1.5 shrink-0 ml-2">
            <button onclick="togglePlayPause()" aria-label="Play or pause" class="w-9 h-9 rounded-xl bg-red-600 hover:bg-red-500 text-white flex items-center justify-center shadow-md shadow-red-600/30 active:scale-95">
                <i class="fa-solid fa-play text-xs ml-0.5" id="mini-play-icon"></i>
            </button>
            <button onclick="playNext()" aria-label="Skip to Next" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center border border-slate-700 active:scale-95">
                <i class="fa-solid fa-forward-step text-xs"></i>
            </button>
        </div>
    </div>

    <script>
        let player = null;
        let queue = [];
        let currentIndex = -1;
        let isLooping = false;
        let isApiReady = false;
        let progressInterval = null;
        let isSeeking = false;
        let recentlyClearedQueue = null;
        let currentSuggestions = [];
        let isAutoplayEnabled = true;
        try {
            const savedAuto = localStorage.getItem('yt_autoplay_enabled');
            if (savedAuto !== null) isAutoplayEnabled = JSON.parse(savedAuto);
        } catch (e) {}

        // Register Service Worker
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW setup failed:', err));
            });
        }

        // Sanitize dynamic strings to prevent XSS
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
            const totalSecs = Math.floor(seconds);
            const hrs = Math.floor(totalSecs / 3600);
            const mins = Math.floor((totalSecs % 3600) / 60);
            const secs = totalSecs % 60;
            if (hrs > 0) {
                return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function startProgressTracking() {
            stopProgressTracking();
            progressInterval = setInterval(updatePlaybackProgress, 500);
        }

        function stopProgressTracking() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function updatePlaybackProgress() {
            if (!player || typeof player.getCurrentTime !== 'function' || !player.getDuration) return;
            const curTime = player.getCurrentTime() || 0;
            const duration = player.getDuration() || 0;

            const timeEl = document.getElementById('current-time');
            const durEl = document.getElementById('current-duration');
            const progressBar = document.getElementById('progress-bar');
            const miniTimeEl = document.getElementById('mini-time');
            const miniDurEl = document.getElementById('mini-duration');

            const formattedCur = formatTime(curTime);
            const formattedDur = duration > 0 ? formatTime(duration) : (duration === 0 ? '--:--' : 'Live');

            if (durEl) durEl.innerText = formattedDur;
            if (miniDurEl) miniDurEl.innerText = formattedDur;

            if (duration > 0 && queue[currentIndex]) {
                const curItem = queue[currentIndex];
                if (!curItem.duration || curItem.duration === '--:--') {
                    curItem.duration = formattedDur;
                    saveQueueToStorage();
                    renderQueue();
                }
            }

            if (!isSeeking && progressBar) {
                if (timeEl) timeEl.innerText = formattedCur;
                if (miniTimeEl) miniTimeEl.innerText = formattedCur;
                if (duration > 0) {
                    progressBar.value = (curTime / duration) * 100;
                } else {
                    progressBar.value = 0;
                }
            }
        }

        function updateSeekDisplay(val) {
            if (!player || !player.getDuration) return;
            const duration = player.getDuration() || 0;
            const targetTime = (val / 100) * duration;
            const timeEl = document.getElementById('current-time');
            if (timeEl) timeEl.innerText = formatTime(targetTime);
        }

        function finishSeek(val) {
            isSeeking = false;
            if (!player || !player.getDuration || typeof player.seekTo !== 'function') return;
            const duration = player.getDuration() || 0;
            if (duration > 0) {
                const targetTime = (val / 100) * duration;
                player.seekTo(targetTime, true);
            }
        }

        const samplePlaylist = [
            { id: 'jfKfPfyJRdk', title: 'Lofi hip hop radio - beats to relax/study to', author: 'Lofi Girl', duration: 'Live' },
            { id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up', author: 'Rick Astley', duration: '3:33' },
            { id: '9bZkp7q19f0', title: 'PSY - GANGNAM STYLE(강남스타일) M/V', author: 'officialpsy', duration: '4:13' }
        ];



        const genreKeywordRules = [
            { genre: 'Synthwave', keywords: ['synthwave', 'retrowave', 'synth', 'cyberpunk', 'outrun', 'vaporwave', '80s'] },
            { genre: 'Lofi & Chill', keywords: ['lofi', 'chillhop', 'study beats', 'relaxing beats', 'sleep beats', 'ambient', 'chill', 'relax', 'beats'] },
            { genre: 'Rock', keywords: ['rock', 'metal', 'grunge', 'punk', 'alternative', 'guitar', 'rhapsody', 'band'] },
            { genre: 'Acoustic Pop', keywords: ['acoustic', 'unplugged', 'piano', 'fingerstyle', 'coffee', 'ballad'] },
            { genre: 'Pop', keywords: ['pop', 'hits', 'chart', 'dance', 'funk', 'disco', 'sugar', 'stars'] },
            { genre: 'K-Pop', keywords: ['kpop', 'k-pop', 'korean', 'gangnam'] },
            { genre: 'Latin Pop', keywords: ['latin', 'reggaeton', 'spanish', 'despacito'] }
        ];

        const knownArtistGenreMap = {
            'linkin park': 'Rock',
            'queen': 'Rock',
            'guns n roses': 'Rock',
            'nirvana': 'Rock',
            'rick astley': 'Pop',
            'ed sheeran': 'Pop',
            'adele': 'Pop',
            'maroon 5': 'Pop',
            'onerepublic': 'Pop',
            'bruno mars': 'Pop',
            'mark ronson': 'Pop',
            'psy': 'K-Pop',
            'lofi girl': 'Lofi & Chill',
            'chilledcow': 'Lofi & Chill',
            'chillhop': 'Lofi & Chill',
            'the midnight': 'Synthwave',
            'kavinsky': 'Synthwave',
            'home': 'Synthwave',
            'luis fonsi': 'Latin Pop'
        };

        const noiseTokensRegex = /\b(official|music|video|audio|lyrics|lyric|remaster|remastered|hd|hq|4k|mv|m\/v|explicit|live|performance|version|visualizer|clip|officiel|oficial|sub|espanol|english|full|album|hour|hours|hr|hrs|loop|seamless|1080p|720p)\b/gi;

        function normalizeTextForComparison(text) {
            return String(text || '')
                .toLowerCase()
                .replace(/\[[^\]]*\]/g, ' ')
                .replace(/\([^\)]*\)/g, ' ')
                .replace(/\|.*$/g, ' ')
                .replace(/\b(ft|feat|featuring)\b\.?.*$/gi, ' ')
                .replace(noiseTokensRegex, ' ')
                .replace(/[^\p{L}\p{N}\s]/gu, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function extractTrackMetadata(title, author = '') {
            let clean = String(title || '')
                .replace(/\[[^\]]*\]/g, '')
                .replace(/\([^\)]*(?:official|video|audio|lyrics|lyric|remaster|remastered|hd|4k|mv|explicit|live|visualizer|version|\d{4})[^\)]*\)/gi, '')
                .replace(/\b(?:m\/v|mv)\b/gi, '')
                .replace(/\|.*$/g, '')
                .trim();

            const cleanedAuthor = String(author || '')
                .replace(/ - Topic$/i, '')
                .replace(/VEVO$/i, '')
                .replace(/Official$/i, '')
                .trim();

            let artist = '';
            let trackName = clean;
            const dashMatch = clean.match(/^(.+?)\s+[-–—]\s+(.+)$/);
            if (dashMatch) {
                artist = dashMatch[1].trim();
                trackName = dashMatch[2].trim();
            } else if (clean.includes(': ')) {
                const parts = clean.split(': ');
                artist = parts[0].trim();
                trackName = parts.slice(1).join(': ').trim();
            } else if (cleanedAuthor) {
                artist = cleanedAuthor;
            }

            // Strip featured artists from trackName for core song comparison
            const coreTrackRaw = trackName
                .replace(/\b(ft|feat|featuring)\b\.?.*$/i, '')
                .replace(/\([^\)]*\)/g, '')
                .trim();

            const searchBlob = `${clean} ${cleanedAuthor} ${artist}`.toLowerCase();
            let detectedGenre = null;
            let detectedArtist = null;

            // 1. Check known artist match
            for (const [art, gen] of Object.entries(knownArtistGenreMap)) {
                if (searchBlob.includes(art)) {
                    detectedArtist = art;
                    detectedGenre = gen;
                    break;
                }
            }

            // 2. Check genre keywords if artist match didn't determine it
            if (!detectedGenre) {
                let bestScore = 0;
                for (const rule of genreKeywordRules) {
                    let score = 0;
                    for (const kw of rule.keywords) {
                        if (searchBlob.includes(kw)) {
                            score += kw.length;
                        }
                    }
                    if (score > bestScore) {
                        bestScore = score;
                        detectedGenre = rule.genre;
                    }
                }
            }

            const resolvedArtist = artist || detectedArtist || cleanedAuthor;
            const fullNorm = normalizeTextForComparison(clean);
            let trackCore = normalizeTextForComparison(coreTrackRaw);
            // If artist name is embedded in trackCore, strip it so we isolate the song title
            const artistNorm = normalizeTextForComparison(resolvedArtist);
            if (artistNorm && trackCore.startsWith(artistNorm + ' ')) {
                trackCore = trackCore.slice(artistNorm.length).trim();
            } else if (artistNorm && trackCore.endsWith(' ' + artistNorm)) {
                trackCore = trackCore.slice(0, -artistNorm.length).trim();
            }

            const trackTokens = trackCore.split(' ').filter(t => t.length > 2);

            return {
                cleanTitle: clean,
                artist: resolvedArtist,
                trackName: coreTrackRaw || clean,
                trackCore: trackCore || fullNorm,
                fullNorm,
                artistNorm,
                trackTokens,
                detectedGenre,
                searchBlob
            };
        }

        function isDuplicateOrSameSong(candidateTitle, candidateAuthor, referenceList) {
            if (!candidateTitle) return true;

            // Filter out multi-hour loop / extended spam videos unless the user is playing one
            const isMultiHourSpam = /\b([1-9]\d*)\s*(hour|hours|hr|hrs)\b/i.test(candidateTitle) || /\b(seamless\s+loop|extended\s+loop)\b/i.test(candidateTitle);
            if (isMultiHourSpam) return true;

            const candMeta = extractTrackMetadata(candidateTitle, candidateAuthor);
            if (!candMeta.fullNorm) return true;

            for (const ref of referenceList) {
                if (!ref || !ref.title) continue;
                const refMeta = ref._meta || extractTrackMetadata(ref.title, ref.author || ref.artist || '');

                // 1. Exact normalized full title or core song title match
                if (candMeta.fullNorm === refMeta.fullNorm) return true;
                if (candMeta.trackCore.length >= 3 && candMeta.trackCore === refMeta.trackCore) return true;

                // 2. Candidate contains the reference song's core title (e.g. "Never Gonna Give You Up | Live at BBC", "Never Gonna Give You Up (2022 Remaster)")
                if (refMeta.trackCore.length >= 4) {
                    if (candMeta.fullNorm.includes(refMeta.trackCore) || candMeta.trackCore.includes(refMeta.trackCore)) {
                        return true;
                    }
                }

                // 3. Reverse containment if same artist and candidate core title is inside reference core title
                if (candMeta.trackCore.length >= 5 && refMeta.trackCore.includes(candMeta.trackCore)) {
                    if (!refMeta.artistNorm || !candMeta.artistNorm ||
                        candMeta.artistNorm.includes(refMeta.artistNorm) ||
                        refMeta.artistNorm.includes(candMeta.artistNorm) ||
                        candMeta.fullNorm.includes(refMeta.artistNorm)) {
                        return true;
                    }
                }

                // 4. High token overlap on the song title (catches slight word reorderings / translations / remixes of the same song)
                if (refMeta.trackTokens.length >= 2) {
                    const matchedTokens = refMeta.trackTokens.filter(tok => candMeta.fullNorm.split(' ').includes(tok));
                    if (matchedTokens.length === refMeta.trackTokens.length) {
                        return true;
                    }
                    if (refMeta.trackTokens.length >= 3 && (matchedTokens.length / refMeta.trackTokens.length) >= 0.75) {
                        return true;
                    }
                }
            }

            return false;
        }

        function buildDiscoveryQueries(videoTitle, author = '', refreshOffset = 0) {
            const meta = extractTrackMetadata(videoTitle, author);
            const queries = [];
            const isRadioOrMix = /\b(radio|lofi|chillhop|synthwave|mix|playlist|beats\s+to|stream)\b/i.test(meta.cleanTitle);

            const artistVariants = ['official music video', 'top songs', 'greatest hits', 'essential tracks', 'popular tracks'];
            const genreVariants = ['music hits official video', 'popular songs mix', 'best tracks playlist', 'classic hits'];

            if (isRadioOrMix) {
                const vibe = meta.detectedGenre || meta.artist || meta.cleanTitle;
                queries.push(`${vibe} chill beats radio lofi`);
                queries.push(`${meta.artist || vibe} hip hop beats mix`);
            } else if (meta.artist) {
                const suffix = artistVariants[refreshOffset % artistVariants.length];
                queries.push(`${meta.artist} ${suffix}`);
                if (meta.detectedGenre) {
                    const gSuffix = genreVariants[refreshOffset % genreVariants.length];
                    queries.push(`${meta.detectedGenre} ${gSuffix}`);
                } else {
                    const altSuffix = artistVariants[(refreshOffset + 1) % artistVariants.length];
                    queries.push(`${meta.artist} ${altSuffix}`);
                }
            } else if (meta.detectedGenre) {
                const gSuffix = genreVariants[refreshOffset % genreVariants.length];
                queries.push(`${meta.detectedGenre} ${gSuffix}`);
                queries.push(`${meta.cleanTitle} similar songs`);
            } else if (meta.cleanTitle) {
                // Fallback when no artist delimiter or author is known: search for related music without locking purely to exact re-uploads
                const primaryTokens = meta.trackTokens.slice(0, 3).join(' ') || meta.cleanTitle;
                queries.push(`${primaryTokens} official music video`);
                queries.push(`${primaryTokens} songs mix`);
            }

            return [...new Set(queries.filter(Boolean))];
        }

        // Live YouTube suggestions cache & per-video in-flight tracking
        const liveSuggestionsCache = new Map();
        const inFlightSuggestionFetches = new Map();
        const dismissedSuggestionIds = new Set();
        let suggestionRefreshCounter = 0;
        let lastSuggestedVideoId = null;

        async function fetchInvidiousSearchQuery(query, page = 1, timeoutMs = 5500) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const url = `https://invidious.f5.si/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=${page}`;
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) return [];
                const data = await response.json();
                return (Array.isArray(data) && !data.error) ? data : [];
            } catch (e) {
                clearTimeout(timeoutId);
                return [];
            }
        }

        async function fetchLiveRecommendedVideos(videoId, videoTitle = '', author = '', refreshOffset = 0) {
            if (!videoId) return null;
            if (refreshOffset === 0 && liveSuggestionsCache.has(videoId) && liveSuggestionsCache.get(videoId).length > 0) {
                return liveSuggestionsCache.get(videoId);
            }

            const currentMeta = extractTrackMetadata(videoTitle, author);
            const referenceTracks = [
                { id: videoId, title: videoTitle, author: author || currentMeta.artist, _meta: currentMeta },
                ...queue.map(q => ({ ...q, _meta: extractTrackMetadata(q.title, q.author || '') }))
            ];

            const queries = buildDiscoveryQueries(videoTitle, author, refreshOffset);
            const page = (refreshOffset >= 2) ? 2 : 1;
            console.log(`%c[Suggestion API]%c Fetching discovery recommendations for "${videoTitle || videoId}" (${videoId}) via queries:`, 'color: #ef4444; font-weight: bold;', 'color: inherit;', queries);

            // 1. Primary: Run discovery queries in parallel (artist tracks + genre/vibe tracks) and filter out any version of the currently playing song
            try {
                const searchPromises = queries.slice(0, 2).map(q => fetchInvidiousSearchQuery(q, page));
                const resultsArrays = await Promise.all(searchPromises);

                // Interleave results from primary artist query and secondary genre/vibe query for balanced variety
                const rawCandidates = [];
                const maxLen = Math.max(0, ...resultsArrays.map(arr => arr.length));
                for (let i = 0; i < maxLen; i++) {
                    for (let qIdx = 0; qIdx < resultsArrays.length; qIdx++) {
                        if (resultsArrays[qIdx][i]) {
                            rawCandidates.push({ raw: resultsArrays[qIdx][i], queryIndex: qIdx });
                        }
                    }
                }

                const acceptedRecs = [];
                const seenIds = new Set([videoId, ...queue.map(q => q.id)]);

                for (const { raw: v, queryIndex } of rawCandidates) {
                    if (!v || v.type !== 'video' || !v.videoId || !v.title) continue;
                    if (seenIds.has(v.videoId)) continue;
                    if (refreshOffset > 0 && dismissedSuggestionIds.has(v.videoId)) continue;

                    // Reject if this candidate is the same song as the currently playing video, a queued track, or an already accepted suggestion
                    if (isDuplicateOrSameSong(v.title, v.author || '', [...referenceTracks, ...acceptedRecs])) {
                        continue;
                    }

                    seenIds.add(v.videoId);
                    const candMeta = extractTrackMetadata(v.title, v.author || '');
                    const isSameArtist = currentMeta.artistNorm &&
                        (candMeta.artistNorm.includes(currentMeta.artistNorm) || currentMeta.artistNorm.includes(candMeta.artistNorm));
                    const dur = v.liveNow ? 'Live' : (v.lengthSeconds ? formatTime(v.lengthSeconds) : '');

                    acceptedRecs.push({
                        id: v.videoId,
                        title: v.title,
                        artist: v.author || candMeta.artist || '',
                        genre: isSameArtist ? `More from ${currentMeta.artist}` : (currentMeta.detectedGenre || 'Recommended'),
                        reason: queryIndex === 0 ? 'More from Artist' : 'Similar Vibe',
                        duration: dur,
                        isLive: true,
                        _meta: candMeta
                    });
                }

                if (acceptedRecs.length > 0) {
                    const cleanRecs = acceptedRecs.map(({ _meta, ...rest }) => rest);
                    console.log(`%c[Suggestion API]%c Filtered & verified ${cleanRecs.length} distinct recommendations.`, 'color: #10b981; font-weight: bold;', 'color: inherit;', cleanRecs[0]);
                    liveSuggestionsCache.set(videoId, cleanRecs);
                    return cleanRecs;
                }
            } catch (err) {
                // Proceed to secondary fallback
            }

            // 2. Secondary fallback: Invidious video endpoint (only if valid recommendedVideos without companion error)
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const response = await fetch(`https://invidious.f5.si/api/v1/videos/${encodeURIComponent(videoId)}`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    if (!data.error && Array.isArray(data.recommendedVideos) && data.recommendedVideos.length > 0) {
                        const acceptedRecs = [];
                        const seenIds = new Set([videoId, ...queue.map(q => q.id)]);
                        for (const v of data.recommendedVideos) {
                            if (!v || !v.videoId || !v.title || seenIds.has(v.videoId)) continue;
                            if (isDuplicateOrSameSong(v.title, v.author || '', [...referenceTracks, ...acceptedRecs])) continue;
                            seenIds.add(v.videoId);
                            const dur = v.liveNow ? 'Live' : (v.lengthSeconds ? formatTime(v.lengthSeconds) : '');
                            acceptedRecs.push({
                                id: v.videoId,
                                title: v.title,
                                artist: v.author || '',
                                genre: 'Live Recommendation',
                                reason: 'YouTube Recommendation',
                                duration: dur,
                                isLive: true,
                                _meta: extractTrackMetadata(v.title, v.author || '')
                            });
                        }
                        if (acceptedRecs.length > 0) {
                            const cleanRecs = acceptedRecs.map(({ _meta, ...rest }) => rest);
                            liveSuggestionsCache.set(videoId, cleanRecs);
                            return cleanRecs;
                        }
                    }
                }
            } catch (e) {
                // Silently ignore companion or network errors
            }

            console.info('[Suggestion API] No live recommendations returned for this video.');
            return null;
        }

        function getActiveVideoContext() {
            const currentVideo = (currentIndex >= 0 && queue[currentIndex]) ? queue[currentIndex] : queue[queue.length - 1];
            if (!currentVideo) return null;
            let author = currentVideo.author || '';
            if (!author && player && typeof player.getVideoData === 'function') {
                try {
                    const data = player.getVideoData();
                    if (data && data.video_id === currentVideo.id && data.author) {
                        author = data.author;
                        currentVideo.author = author;
                    }
                } catch (e) {}
            }
            return { video: currentVideo, author };
        }

        async function triggerLiveSuggestionFetch(videoId, title = '', author = '', refreshOffset = 0) {
            if (!videoId) return;
            if (refreshOffset === 0 && liveSuggestionsCache.has(videoId) && liveSuggestionsCache.get(videoId).length > 0) {
                const activeCtx = getActiveVideoContext();
                if (activeCtx && activeCtx.video && activeCtx.video.id === videoId) {
                    updateSuggestionsList();
                    renderQueue();
                }
                return;
            }
            if (inFlightSuggestionFetches.has(videoId)) {
                return inFlightSuggestionFetches.get(videoId);
            }

            const fetchPromise = (async () => {
                try {
                    const recs = await fetchLiveRecommendedVideos(videoId, title, author, refreshOffset);
                    liveSuggestionsCache.set(videoId, (recs && recs.length > 0) ? recs : []);
                } catch (e) {
                    console.warn('[Suggestion API] Error fetching live suggestions:', e);
                    liveSuggestionsCache.set(videoId, []);
                } finally {
                    inFlightSuggestionFetches.delete(videoId);
                    const activeCtx = getActiveVideoContext();
                    if (activeCtx && activeCtx.video && activeCtx.video.id === videoId) {
                        updateSuggestionsList();
                        renderQueue();
                    }
                }
            })();

            inFlightSuggestionFetches.set(videoId, fetchPromise);
            return fetchPromise;
        }

        function updateSuggestionsList(forceNew = false) {
            const ctx = getActiveVideoContext();
            if (!ctx || !ctx.video) {
                currentSuggestions = [];
                lastSuggestedVideoId = null;
                return [];
            }

            const { video: currentVideo, author } = ctx;
            lastSuggestedVideoId = currentVideo.id;
            const currentMeta = extractTrackMetadata(currentVideo.title, author);
            const referenceTracks = [
                { id: currentVideo.id, title: currentVideo.title, author: author || currentMeta.artist, _meta: currentMeta },
                ...queue.map(q => ({ ...q, _meta: extractTrackMetadata(q.title, q.author || '') }))
            ];

            // 1. Check live recommendations cache (always re-filtering against current queue & playing song)
            if (liveSuggestionsCache.has(currentVideo.id)) {
                const cached = liveSuggestionsCache.get(currentVideo.id) || [];
                const acceptedLive = [];
                for (const item of cached) {
                    if (queue.some(q => q.id === item.id)) continue;
                    if (dismissedSuggestionIds.has(item.id) && cached.length > 6) continue;
                    if (isDuplicateOrSameSong(item.title, item.artist || '', [...referenceTracks, ...acceptedLive])) continue;
                    acceptedLive.push(item);
                }
                currentSuggestions = acceptedLive.slice(0, 15);
                return currentSuggestions;
            }

            // 2. Fetch live suggestions from API in background
            triggerLiveSuggestionFetch(currentVideo.id, currentVideo.title, author);
            currentSuggestions = [];
            return [];
        }

        function refreshSuggestionsList() {
            const ctx = getActiveVideoContext();
            suggestionRefreshCounter++;
            // Mark currently top visible suggestions as seen so refresh rotates fresh tracks to the top
            currentSuggestions.slice(0, 4).forEach(item => {
                if (item && item.id) dismissedSuggestionIds.add(item.id);
            });
            if (dismissedSuggestionIds.size > 60) {
                dismissedSuggestionIds.clear();
            }

            if (ctx && ctx.video) {
                liveSuggestionsCache.delete(ctx.video.id);
                inFlightSuggestionFetches.delete(ctx.video.id);
                triggerLiveSuggestionFetch(ctx.video.id, ctx.video.title, ctx.author, suggestionRefreshCounter);
            }
            updateSuggestionsList(true);
            renderQueue();
            showToast("Refreshing recommendations...", "info");
        }

        function addSuggestionItemToQueue(index, playImmediately = false) {
            if (index < 0 || index >= currentSuggestions.length) return;
            const item = currentSuggestions.splice(index, 1)[0];
            if (!item) return;

            if (queue.some(q => q.id === item.id)) {
                showToast("Video is already in the queue", "info");
                return;
            }

            queue.push({
                id: item.id,
                title: item.title,
                author: item.artist || item.author || '',
                duration: item.duration || '',
                addedAt: Date.now()
            });
            saveQueueToStorage();

            if (playImmediately) {
                playQueueIndex(queue.length - 1);
                showToast(`Playing: ${item.title}`, "success");
            } else {
                updateSuggestionsList();
                renderQueue();
                showToast(`Added to queue: ${item.title}`, "success");
            }
        }

        function playAutoNextSuggestion() {
            updateSuggestionsList();
            const ctx = getActiveVideoContext();
            const refTracks = ctx && ctx.video
                ? [{ id: ctx.video.id, title: ctx.video.title, author: ctx.author }, ...queue]
                : [...queue];

            let nextVideo = null;
            while (currentSuggestions.length > 0) {
                const candidate = currentSuggestions.shift();
                if (
                    candidate &&
                    candidate.id &&
                    !queue.some(item => item.id === candidate.id) &&
                    !isDuplicateOrSameSong(candidate.title, candidate.artist || '', refTracks)
                ) {
                    nextVideo = candidate;
                    break;
                }
            }

            if (!nextVideo) return false;

            queue.push({
                id: nextVideo.id,
                title: nextVideo.title,
                author: nextVideo.artist || nextVideo.author || '',
                duration: nextVideo.duration || '',
                addedAt: Date.now()
            });
            saveQueueToStorage();
            const newIndex = queue.length - 1;
            playQueueIndex(newIndex);
            showToast(`Autoplay: ${nextVideo.title}`, "info");
            return true;
        }

        function addAllSuggestionsToQueue() {
            if (currentSuggestions.length === 0) return;
            let addedCount = 0;
            while (currentSuggestions.length > 0) {
                const item = currentSuggestions.shift();
                if (item && item.id && !queue.some(q => q.id === item.id)) {
                    queue.push({
                        id: item.id,
                        title: item.title,
                        author: item.artist || item.author || '',
                        duration: item.duration || '',
                        addedAt: Date.now()
                    });
                    addedCount++;
                }
            }
            saveQueueToStorage();
            updateSuggestionsList();
            renderQueue();
            showToast(addedCount > 0 ? `Added ${addedCount} suggested video(s) to queue!` : "Suggestions already in queue", "success");
        }

        function addCurrentSuggestion() {
            addSuggestionItemToQueue(0, false);
        }

        function refreshSuggestion() {
            refreshSuggestionsList();
        }

        if (window.location.protocol === 'file:') {
            setTimeout(() => {
                showToast("⚠️ Opened via file://! Deploy to GitHub Pages or localhost so YouTube allows embeds.", "error");
            }, 800);
        }

        // Manage overlay states cleanly
        function showOverlay(mode, errorCode = null, videoId = null) {
            const overlay = document.getElementById('click-to-play-overlay');
            if (mode === 'hidden') {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                return;
            }

            if (mode === 'tap-to-play') {
                overlay.innerHTML = `
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-red-600 text-white flex items-center justify-center mb-3 shadow-lg shadow-red-600/40 hover:scale-105 transition-transform">
                        <i class="fa-solid fa-play text-xl sm:text-2xl ml-1"></i>
                    </div>
                    <h3 class="text-sm font-semibold text-white mb-1">Tap to Start Playback</h3>
                    <p class="text-xs text-slate-400 max-w-xs">iOS and browsers require a direct tap to start audio/video playback.</p>
                `;
            } else if (mode === 'error') {
                const isLocalFile = window.location.protocol === 'file:';
                const reason = isLocalFile 
                    ? "You are opening this file via file://. Host on GitHub Pages or localhost to play music videos."
                    : "The video owner has disabled playback on external websites.";
                const safeId = videoId ? escapeHtml(videoId) : '';

                overlay.innerHTML = `
                    <div class="w-14 h-14 rounded-full bg-rose-600/20 border border-rose-500/40 text-rose-400 flex items-center justify-center mb-2.5 shadow-lg">
                        <i class="fa-solid fa-ban text-xl"></i>
                    </div>
                    <h3 class="text-sm font-semibold text-white mb-1">Embed Restricted (Error ${escapeHtml(errorCode)})</h3>
                    <p class="text-xs text-slate-400 max-w-xs mb-3">${reason}</p>
                    <div class="flex items-center space-x-2.5">
                        ${safeId ? `
                            <a href="https://www.youtube.com/watch?v=${safeId}" target="_blank" rel="noopener" 
                                onclick="event.stopPropagation()"
                                class="px-3.5 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-medium rounded-xl transition-all flex items-center space-x-1.5 shadow-lg">
                                <i class="fa-brands fa-youtube"></i>
                                <span>Open in YouTube</span>
                            </a>
                        ` : ''}
                        <button onclick="event.stopPropagation(); playNext();" 
                                class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl border border-slate-700 transition-all">
                            Skip <i class="fa-solid fa-forward-step ml-1"></i>
                        </button>
                    </div>
                `;
            }

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
        }

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            const isHttp = window.location.protocol.startsWith('http');
            const playerVars = {
                'autoplay': 1,
                'controls': 1,
                'playsinline': 1,
                'modestbranding': 1,
                'rel': 0,
                'enablejsapi': 1,
                'iv_load_policy': 3
            };

            if (isHttp && window.location.origin && window.location.origin !== 'null') {
                playerVars.origin = window.location.origin;
                playerVars.widget_referrer = window.location.href;
            }

            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                host: 'https://www.youtube.com',
                playerVars: playerVars,
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady() {
            isApiReady = true;
            if (queue.length > 0 && currentIndex >= 0 && queue[currentIndex]) {
                if (player && typeof player.cueVideoById === 'function') {
                    player.cueVideoById(queue[currentIndex].id);
                }
                updateCurrentVideoMetadata();
                showOverlay('tap-to-play');
                const target = queue[currentIndex];
                triggerLiveSuggestionFetch(target.id, target.title, target.author || '');
            }
        }

        function onPlayerStateChange(event) {
            const playPauseIcon = document.getElementById('play-pause-icon');
            const miniPlayIcon = document.getElementById('mini-play-icon');
            const miniWave = document.getElementById('mini-wave');

            if (event.data === YT.PlayerState.PLAYING) {
                if (playPauseIcon) playPauseIcon.className = "fa-solid fa-pause text-sm sm:text-base";
                if (miniPlayIcon) miniPlayIcon.className = "fa-solid fa-pause text-xs";
                if (miniWave) miniWave.classList.remove('opacity-0');
                showOverlay('hidden');
                startProgressTracking();
                updateCurrentVideoMetadata();
                if (queue[currentIndex] && player && typeof player.getVideoData === 'function') {
                    try {
                        const vData = player.getVideoData();
                        if (vData && vData.author && !queue[currentIndex].author) {
                            queue[currentIndex].author = vData.author;
                            saveQueueToStorage();
                        }
                    } catch (e) {}
                }
                if ('mediaSession' in navigator && queue[currentIndex]) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: queue[currentIndex].title,
                        artist: queue[currentIndex].author || 'YT Queue Streamer',
                        artwork: [{ src: `https://img.youtube.com/vi/${queue[currentIndex].id}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }]
                    });
                    navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
                    navigator.mediaSession.setActionHandler('nexttrack', playNext);
                }
            } else if (event.data === YT.PlayerState.PAUSED) {
                if (playPauseIcon) playPauseIcon.className = "fa-solid fa-play ml-0.5 text-sm sm:text-base";
                if (miniPlayIcon) miniPlayIcon.className = "fa-solid fa-play ml-0.5 text-xs";
                if (miniWave) miniWave.classList.add('opacity-0');
                stopProgressTracking();
            } else if (event.data === YT.PlayerState.ENDED) {
                if (playPauseIcon) playPauseIcon.className = "fa-solid fa-play ml-0.5 text-sm sm:text-base";
                if (miniPlayIcon) miniPlayIcon.className = "fa-solid fa-play ml-0.5 text-xs";
                if (miniWave) miniWave.classList.add('opacity-0');
                stopProgressTracking();
                handleVideoEnded();
            }
        }

        function onPlayerError(event) {
            console.warn("YouTube Player Error code:", event.data);
            const currentVideo = queue[currentIndex];
            stopProgressTracking();
            if (event.data === 150 || event.data === 101 || event.data === 153) {
                showToast("Video restricted by owner.", "error");
                showOverlay('error', event.data, currentVideo ? currentVideo.id : null);
            } else {
                showToast(`Playback error (${event.data})`, "error");
                if (queue.length > 1 && (currentIndex + 1 < queue.length || isLooping)) {
                    setTimeout(() => playNext(), 1500);
                } else {
                    showOverlay('error', event.data, currentVideo ? currentVideo.id : null);
                }
            }
        }

        function retryPlayback() {
            showOverlay('hidden');
            if (currentIndex >= 0 && queue[currentIndex]) {
                playQueueIndex(currentIndex);
            } else if (queue.length > 0) {
                playQueueIndex(0);
            }
        }

        function extractVideoId(urlOrId) {
            if (!urlOrId) return null;
            urlOrId = urlOrId.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(urlOrId)) return urlOrId;
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|shorts\/|live\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function fetchVideoDetails(videoId) {
            // 1. Try Invidious video endpoint first for duration, title, and channel
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);
                const response = await fetch(`https://invidious.f5.si/api/v1/videos/${encodeURIComponent(videoId)}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.title) {
                        const dur = data.liveNow ? 'Live' : (data.lengthSeconds ? formatTime(data.lengthSeconds) : '');
                        return { title: data.title, author: data.author || '', duration: dur };
                    }
                }
            } catch (e) {
                // Proceed to oEmbed fallback
            }

            // 2. YouTube official oEmbed fallback
            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.title) {
                        return { title: data.title, author: data.author_name || '', duration: '' };
                    }
                }
            } catch (e) {
                console.warn("YouTube oEmbed fetch failed, trying fallback...", e);
            }

            // 3. noembed fallback
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.title) {
                        return { title: data.title, author: data.author_name || '', duration: '' };
                    }
                }
            } catch (e) {
                console.warn("Could not fetch oEmbed title fallback.", e);
            }
            return { title: `YouTube Video (${videoId})`, author: '', duration: '' };
        }

        async function fetchVideoTitle(videoId) {
            const details = await fetchVideoDetails(videoId);
            return details.title;
        }

        async function addVideoToQueue(event) {
            event.preventDefault();
            const input = document.getElementById('video-url-input');
            const videoId = extractVideoId(input.value);

            if (!videoId) {
                showToast("Please enter a valid YouTube link or ID", "error");
                return;
            }

            if (queue.some(item => item.id === videoId)) {
                showToast("Video is already in the queue", "info");
                input.value = '';
                return;
            }

            input.value = '';
            input.blur();
            showToast("Fetching video details...", "info");

            const { title, author, duration } = await fetchVideoDetails(videoId);
            queue.push({ id: videoId, title: title, author: author, duration: duration || '', addedAt: Date.now() });
            saveQueueToStorage();
            updateSuggestionsList();
            renderQueue();
            triggerLiveSuggestionFetch(videoId, title, author);

            if (currentIndex === -1 && queue.length === 1) {
                playQueueIndex(0);
            } else {
                showToast("Added to queue!", "success");
            }
        }

        function handleQueueKeydown(event, index) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                playQueueIndex(index);
            }
        }

        let isResolvingDurations = false;
        async function resolveMissingQueueDurations() {
            if (isResolvingDurations || queue.length === 0) return;
            const itemsNeedingDuration = queue.filter(item => !item.duration || item.duration === '--:--');
            if (itemsNeedingDuration.length === 0) return;
            isResolvingDurations = true;

            try {
                let updated = false;
                for (const item of itemsNeedingDuration) {
                    if (item.duration && item.duration !== '--:--') continue;
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3500);
                        const res = await fetch(`https://invidious.f5.si/api/v1/videos/${encodeURIComponent(item.id)}`, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        if (res.ok) {
                            const data = await res.json();
                            if (data) {
                                const dur = data.liveNow ? 'Live' : (data.lengthSeconds ? formatTime(data.lengthSeconds) : '');
                                if (dur) {
                                    item.duration = dur;
                                    updated = true;
                                }
                                if (data.author && !item.author) {
                                    item.author = data.author;
                                    updated = true;
                                }
                            }
                        }
                    } catch (e) {}
                }
                if (updated) {
                    saveQueueToStorage();
                    renderQueue();
                }
            } finally {
                isResolvingDurations = false;
            }
        }
