<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- iOS & Android PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT Queue">
    <meta name="theme-color" content="#020617">

    <title>YouTube Queue Player</title>

    <!-- Static Manifest & Apple Touch Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        input {
            -webkit-user-select: text;
            user-select: text;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col md:flex-row overflow-hidden">

        let recentlyClearedQueue = null;
        let currentSuggestion = null;

        // Register Service Worker
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW setup failed:', err));
            });

        // Sanitize dynamic strings to prevent XSS
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function startProgressTracking() {
            stopProgressTracking();
            progressInterval = setInterval(updatePlaybackProgress, 500);
        }

        function stopProgressTracking() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
        }

        function updatePlaybackProgress() {
            if (!player || typeof player.getCurrentTime !== 'function' || !player.getDuration) return;
            const curTime = player.getCurrentTime() || 0;
            const duration = player.getDuration() || 0;

            const timeEl = document.getElementById('current-time');
            const durEl = document.getElementById('current-duration');
            const progressBar = document.getElementById('progress-bar');

            if (durEl) {
                durEl.innerText = duration > 0 ? formatTime(duration) : (duration === 0 ? '--:--' : 'Live');
            }

            if (!isSeeking && progressBar) {
                if (timeEl) timeEl.innerText = formatTime(curTime);
                if (duration > 0) {
                    progressBar.value = (curTime / duration) * 100;
                } else {
                    progressBar.value = 0;
                }
            }
        }

        function updateSeekDisplay(val) {
            if (!player || !player.getDuration) return;
            const duration = player.getDuration() || 0;
            const targetTime = (val / 100) * duration;
            const timeEl = document.getElementById('current-time');
            if (timeEl) timeEl.innerText = formatTime(targetTime);
        }

        function finishSeek(val) {
            isSeeking = false;
            if (!player || !player.getDuration || typeof player.seekTo !== 'function') return;
            const duration = player.getDuration() || 0;
            if (duration > 0) {
                const targetTime = (val / 100) * duration;
                player.seekTo(targetTime, true);
            }
        }

        const knownArtistGenreMap = {

        function extractTrackMetadata(title, author = '') {
            let clean = (title || '')
                .replace(/\[[^\]]*\]/g, '')
                .replace(/\([^\)]*(?:official|video|audio|lyrics|remaster|hd|4k|mv|explicit)[^\)]*\)/gi, '')
                .replace(/\|.*$/g, '')
                .trim();

            let artist = '';
            let trackName = clean;
            if (clean.includes(' - ')) {
                const parts = clean.split(' - ');
                artist = parts[0].trim();
                trackName = parts.slice(1).join(' - ').trim();
            } else if (clean.includes(': ')) {
                const parts = clean.split(': ');
                artist = parts[0].trim();
                trackName = parts.slice(1).join(': ').trim();
            } else if (author) {
                artist = author.replace(/ - Topic$/i, '').replace(/VEVO$/i, '').trim();
            }

            const searchBlob = `${clean} ${author} ${artist}`.toLowerCase();
            let detectedGenre = null;
            let detectedArtist = null;

            // 1. Check known artist match
            for (const [art, gen] of Object.entries(knownArtistGenreMap)) {
                if (searchBlob.includes(art)) {
                    detectedArtist = art;
                    detectedGenre = gen;
                    break;
                }
            }

            // 2. Check genre keywords if artist match didn't determine it
            if (!detectedGenre) {
                let bestScore = 0;
                for (const rule of genreKeywordRules) {
                    let score = 0;
                    for (const kw of rule.keywords) {
                        if (searchBlob.includes(kw)) {
                            score += kw.length;
                        }
                    }
                    if (score > bestScore) {
                        bestScore = score;
                        detectedGenre = rule.genre;
                    }
                }
            }

            return {
                cleanTitle: clean,
                artist: artist || detectedArtist,
                detectedGenre: detectedGenre,
                searchBlob
            };
        }

        // Live YouTube suggestions cache & instances
        const liveSuggestionsCache = new Map();
        const INVIDIOUS_INSTANCES = [
            'https://invidious.f5.si',
            'https://inv.nadeko.net'
        ];

        async function fetchLiveRecommendedVideos(videoId) {
            if (!videoId) return null;
            if (liveSuggestionsCache.has(videoId)) {
                return liveSuggestionsCache.get(videoId);
            }

            for (const instance of INVIDIOUS_INSTANCES) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3500);
                    const response = await fetch(`${instance}/api/v1/videos/${videoId}`, {
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const data = await response.json();
                        if (Array.isArray(data.recommendedVideos) && data.recommendedVideos.length > 0) {
                            const recs = data.recommendedVideos
                                .filter(v => v && v.videoId && v.title)
                                .map(v => ({
                                    id: v.videoId,
                                    title: v.title,
                                    artist: v.author || '',
                                    genre: 'Live Recommendation',
                                    reason: 'Up Next on YouTube',
                                    isLive: true
                                }));
                            if (recs.length > 0) {
                                liveSuggestionsCache.set(videoId, recs);
                                return recs;
                            }
                        }
                    }
                } catch (e) {
                    // Try next mirror
                }
            }
            return null;
        }

        async function triggerLiveSuggestionFetch(videoId) {
            if (!videoId || liveSuggestionsCache.has(videoId)) return;
            try {
                const recs = await fetchLiveRecommendedVideos(videoId);
                if (recs && recs.length > 0) {
                    liveSuggestionsCache.set(videoId, recs);
                    // If user is currently playing this last video, smoothly update to live recommendation
                    if (currentIndex >= 0 && currentIndex === queue.length - 1 && queue[currentIndex]?.id === videoId) {
                        pickNextSuggestion(true);
                        renderQueue();
                    }
                } else {
                    liveSuggestionsCache.set(videoId, []);
                }
            } catch (e) {
                liveSuggestionsCache.set(videoId, []);
            }
        }

        function getAvailableSuggestions() {
            return suggestionCatalog.filter(item => !queue.some(q => q.id === item.id));
        }

        function pickNextSuggestion(forceNew = false) {
            const currentVideo = queue[currentIndex];
            if (!currentVideo) {
                currentSuggestion = null;
                return null;
            }

            // 1. Check if we have live YouTube recommendations for current video
            if (liveSuggestionsCache.has(currentVideo.id)) {
                const liveList = (liveSuggestionsCache.get(currentVideo.id) || []).filter(item => !queue.some(q => q.id === item.id));
                if (liveList.length > 0) {
                    if (!forceNew && currentSuggestion && liveList.some(s => s.id === currentSuggestion.id)) {
                        return currentSuggestion;
                    }
                    const pool = (forceNew && currentSuggestion) ? liveList.filter(s => s.id !== currentSuggestion.id) : liveList;
                    const candidates = pool.length > 0 ? pool : liveList;
                    currentSuggestion = candidates[Math.floor(Math.random() * candidates.length)];
                    return currentSuggestion;
                }
            } else {
                // Not yet fetched for this video: trigger async fetch in background
                triggerLiveSuggestionFetch(currentVideo.id);
            }

            // 2. Smart local catalog fallback (if live not ready, offline, or empty)
            const available = getAvailableSuggestions();
            if (available.length === 0) {
                currentSuggestion = null;
                return null;
            }

            if (!forceNew && currentSuggestion && available.some(s => s.id === currentSuggestion.id)) {
                return currentSuggestion;
            }

            let author = '';
            if (player && typeof player.getVideoData === 'function') {
                const data = player.getVideoData();
                if (data && data.author) author = data.author;
            }

            const currentMeta = extractTrackMetadata(currentVideo.title, author);

            // Score candidate suggestions based on extracted context
            const scoredCandidates = available.map(candidate => {
                let score = 0;
                let reason = 'Curated pick';

                if (currentMeta) {
                    if (currentMeta.artist && candidate.artist.toLowerCase().includes(currentMeta.artist.toLowerCase())) {
                        score += 70;
                        reason = `More from ${candidate.artist}`;
                    } else if (currentMeta.detectedGenre && candidate.genre.toLowerCase().includes(currentMeta.detectedGenre.toLowerCase())) {
                        score += 50;
                        reason = `Similar ${candidate.genre} vibe`;
                    }

                    for (const kw of candidate.keywords) {
                        if (currentMeta.searchBlob.includes(kw)) {
                            score += 15;
                            if (reason === 'Curated pick') {
                                reason = `Matches '${kw}'`;
                            }
                        }
                    }
                }

                if (currentSuggestion && candidate.id === currentSuggestion.id) {
                    score -= 100;
                }

                score += Math.random() * 8;

                return {
                    ...candidate,
                    score,
                    reason,
                    isLive: false
                };
            });

            scoredCandidates.sort((a, b) => b.score - a.score);
            currentSuggestion = scoredCandidates[0];
            return currentSuggestion;
        }

        function refreshSuggestion() {
            pickNextSuggestion(true);
            renderQueue();
        }

        function addCurrentSuggestion() {
            if (!currentSuggestion) return;
            addSuggestionToQueue(currentSuggestion.id, currentSuggestion.title);
        }

        function addSuggestionToQueue(id, title) {
            if (!id) return;
            if (queue.some(item => item.id === id)) {
                showToast("Video is already in the queue", "info");
                return;
            }
            queue.push({ id: id, title: title, addedAt: Date.now() });
            currentSuggestion = null;
            saveQueueToStorage();
            renderQueue();
            showToast("Added suggested video to queue!", "success");
        }

        if (window.location.protocol === 'file:') {
            setTimeout(() => {
                showToast("⚠️ Opened via file://! Deploy to GitHub Pages or localhost so YouTube allows embeds.", "error");
            }, 800);
        }

        // Manage overlay states cleanly
        function showOverlay(mode, errorCode = null, videoId = null) {

                overlay.style.opacity = '0';

                overlay.innerHTML = `
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-red-600 text-white flex items-center justify-center mb-3 shadow-lg shadow-red-600/40 hover:scale-105 transition-transform">

                    <p class="text-xs text-slate-400 max-w-xs">iOS and browsers require a direct tap to start audio/video playback.</p>
                `;
            } else if (mode === 'error') {
                const isLocalFile = window.location.protocol === 'file:';
                const reason = isLocalFile 
                    ? "You are opening this file via file://. Host on GitHub Pages or localhost to play music videos."
                    : "The video owner has disabled playback on external websites.";
                const safeId = videoId ? escapeHtml(videoId) : '';

                overlay.innerHTML = `
                    <div class="w-14 h-14 rounded-full bg-rose-600/20 border border-rose-500/40 text-rose-400 flex items-center justify-center mb-2.5 shadow-lg">

                        ${safeId ? `
                            <a href="https://www.youtube.com/watch?v=${safeId}" target="_blank" rel="noopener" 
                                onclick="event.stopPropagation()"
                                class="px-3.5 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-medium rounded-xl transition-all flex items-center space-x-1.5 shadow-lg">
                                <i class="fa-brands fa-youtube"></i>
                                <span>Open in YouTube</span>
                            </a>
                        ` : ''}
                        <button onclick="event.stopPropagation(); playNext();" 
                                class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-xl border border-slate-700 transition-all">
                            Skip <i class="fa-solid fa-forward-step ml-1"></i>
                        </button>
                    </div>

            }

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';

        // Load YouTube IFrame API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            const isHttp = window.location.protocol.startsWith('http');
            const playerVars = {
                'autoplay': 1,
                'controls': 1,
                'playsinline': 1,
                'modestbranding': 1,
                'rel': 0,
                'enablejsapi': 1,
                'iv_load_policy': 3
            };

            if (isHttp && window.location.origin && window.location.origin !== 'null') {
                playerVars.origin = window.location.origin;
                playerVars.widget_referrer = window.location.href;
            }

            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                host: 'https://www.youtube.com',
                playerVars: playerVars,
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady() {
            isApiReady = true;
            renderQueue();
            loadSavedQueue();
        }

        function onPlayerStateChange(event) {
            const playPauseIcon = document.getElementById('play-pause-icon');
            if (event.data === YT.PlayerState.PLAYING) {
                playPauseIcon.className = "fa-solid fa-pause text-sm sm:text-base";
                showOverlay('hidden');
                startProgressTracking();
                updateCurrentVideoMetadata();
                if ('mediaSession' in navigator && queue[currentIndex]) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: queue[currentIndex].title,
                        artist: 'YT Queue Streamer',
                        artwork: [{ src: `https://img.youtube.com/vi/${queue[currentIndex].id}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }]
                    });
                    navigator.mediaSession.setActionHandler('previoustrack', playPrevious);
                    navigator.mediaSession.setActionHandler('nexttrack', playNext);
                }
            } else if (event.data === YT.PlayerState.PAUSED) {
                playPauseIcon.className = "fa-solid fa-play ml-0.5 text-sm sm:text-base";
                stopProgressTracking();
            } else if (event.data === YT.PlayerState.ENDED) {
                stopProgressTracking();
                handleVideoEnded();
            }
        }

        function onPlayerError(event) {
            console.warn("YouTube Player Error code:", event.data);
            const currentVideo = queue[currentIndex];
            stopProgressTracking();
            if (event.data === 150 || event.data === 101 || event.data === 153) {
                showToast("Video restricted by owner.", "error");
                showOverlay('error', event.data, currentVideo ? currentVideo.id : null);
            } else {
                showToast(`Playback error (${event.data})`, "error");
                if (queue.length > 1 && (currentIndex + 1 < queue.length || isLooping)) {
                    setTimeout(() => playNext(), 1500);
                } else {
                    showOverlay('error', event.data, currentVideo ? currentVideo.id : null);
                }
            }
        }

        function retryPlayback() {
            showOverlay('hidden');
            if (currentIndex >= 0 && queue[currentIndex]) {
                playQueueIndex(currentIndex);
            } else if (queue.length > 0) {
                playQueueIndex(0);
            }
        }

        function extractVideoId(urlOrId) {
            if (!urlOrId) return null;
            urlOrId = urlOrId.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(urlOrId)) return urlOrId;
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|shorts\/|live\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = urlOrId.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function fetchVideoTitle(videoId) {
            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.title) return data.title;
                }
            } catch (e) {
                console.warn("YouTube oEmbed fetch failed, trying fallback...", e);
            }
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.title) return data.title;
                }
            } catch (e) {
                console.warn("Could not fetch oEmbed title fallback.", e);
            }
            return `YouTube Video (${videoId})`;
        }

        async function addVideoToQueue(event) {
            event.preventDefault();
            const input = document.getElementById('video-url-input');
            const videoId = extractVideoId(input.value);

            if (!videoId) {
                showToast("Please enter a valid YouTube link or ID", "error");
                return;
            }

            if (queue.some(item => item.id === videoId)) {
                showToast("Video is already in the queue", "info");
                input.value = '';
                return;
            }

            input.value = '';
            input.blur();
            showToast("Fetching video details...", "info");

            const title = await fetchVideoTitle(videoId);
            queue.push({ id: videoId, title: title, addedAt: Date.now() });
            saveQueueToStorage();
            renderQueue();

            if (currentIndex === -1 && queue.length === 1) {
                playQueueIndex(0);
            } else {
                showToast("Added to queue!", "success");
            }
        }

        function handleQueueKeydown(event, index) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                playQueueIndex(index);
            }
        }

        function renderQueue() {
            const container = document.getElementById('queue-container');
            const countBadge = document.getElementById('queue-count');
            countBadge.innerText = `${queue.length} item${queue.length === 1 ? '' : 's'}`;

            if (queue.length === 0) {
                currentSuggestion = null;
                container.innerHTML = `
                    <div id="queue-empty-state" class="h-full flex flex-col items-center justify-center text-center text-slate-500 p-4">

                    </div>
                `;
                return;
            }

            let html = '';
            queue.forEach((item, index) => {
                const isPlaying = index === currentIndex;
                const activeClass = isPlaying ? 'bg-red-600/10 border-red-500/40 text-white shadow-md' : 'bg-slate-900/80 border-slate-800/80 text-slate-300 hover:bg-slate-900';

                const safeId = escapeHtml(item.id);

                html += `

                                <img src="https://img.youtube.com/vi/${safeId}/hqdefault.jpg" onerror="this.src='https://placehold.co/120x90/1e293b/64748b?text=YT'" class="w-full h-full object-cover" alt="Thumbnail">
                                ${isPlaying ? '<div class="absolute inset-0 bg-red-600/40 flex items-center justify-center"><i class="fa-solid fa-volume-high text-white text-xs animate-pulse"></i></div>' : ''}
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-xs font-semibold truncate ${isPlaying ? 'text-red-400' : 'text-slate-200'}">${safeTitle}</div>
                                <div class="text-[10px] text-slate-500">ID: ${safeId}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-0.5 ml-2 shrink-0">
                            ${index > 0 ? `<button onclick="moveQueueItem(event, ${index}, ${index - 1})" aria-label="Move track up" class="p-1.5 text-slate-500 hover:text-slate-300 rounded transition-colors" title="Move Up"><i class="fa-solid fa-chevron-up text-xs"></i></button>` : ''}
                            ${index < queue.length - 1 ? `<button onclick="moveQueueItem(event, ${index}, ${index + 1})" aria-label="Move track down" class="p-1.5 text-slate-500 hover:text-slate-300 rounded transition-colors" title="Move Down"><i class="fa-solid fa-chevron-down text-xs"></i></button>` : ''}
                            <button onclick="removeFromQueue(event, ${index})" aria-label="Remove track from queue" class="p-1.5 text-slate-500 hover:text-rose-400 rounded transition-colors" title="Remove"><i class="fa-solid fa-xmark text-sm"></i></button>
                        </div>
                    </div>
                `;

            // If queue is currently playing the last video, show a suggested video card
            if (currentIndex === queue.length - 1) {
                const suggestion = pickNextSuggestion();
                if (suggestion) {
                    const safeSugId = escapeHtml(suggestion.id);
                    const safeSugTitle = escapeHtml(suggestion.title);
                    const safeSugGenre = escapeHtml(suggestion.artist || suggestion.genre || 'Recommended');
                    const isLive = Boolean(suggestion.isLive);
                    const badgeIcon = isLive ? 'fa-brands fa-youtube text-red-500' : 'fa-solid fa-bolt-lightning text-amber-400';
                    const badgeText = isLive ? 'Live YouTube Up Next' : escapeHtml(suggestion.reason || 'Similar vibe');

                    html += `
                        <div class="pt-2 mt-2 border-t border-slate-800/80 animate-fadeIn">

                                        <i class="${badgeIcon} text-[9px] mr-0.5"></i>
                                        <span>${badgeText}</span>
                                    </span>
                                </div>
                                <button onclick="refreshSuggestion()" aria-label="Shuffle suggestion" title="Get another similar suggestion" class="text-[11px] text-slate-400 hover:text-white px-2 py-0.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 transition-colors flex items-center space-x-1.5 shrink-0 ml-1">

                                <div class="flex items-center space-x-3 min-w-0 flex-1 cursor-pointer focus:outline-none focus:ring-1 focus:ring-red-500 rounded-lg p-1 -m-1"
                                     role="button" tabindex="0"
                                     aria-label="Add suggested video ${safeSugTitle} to queue"
                                     onclick="addCurrentSuggestion()"
                                     onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();addCurrentSuggestion();}">
                                    <div class="relative w-14 h-9 sm:w-16 sm:h-10 bg-slate-800 rounded-lg overflow-hidden shrink-0 border border-slate-700/50 flex items-center justify-center">
                                        <img src="https://img.youtube.com/vi/${safeSugId}/hqdefault.jpg" onerror="this.src='https://placehold.co/120x90/1e293b/64748b?text=YT'" class="w-full h-full object-cover" alt="Thumbnail">
                                        <div class="absolute inset-0 bg-slate-950/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i class="fa-solid fa-plus text-white text-xs"></i>
                                        </div>
                                    </div>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-xs font-semibold truncate text-slate-200 group-hover:text-red-400 transition-colors">${safeSugTitle}</div>
                                        <div class="flex items-center space-x-2 text-[10px] text-slate-400 mt-0.5">
                                            <span class="text-slate-400 font-medium">${safeSugGenre}</span>
                                            <span class="text-slate-600">•</span>
                                            <span class="text-red-400/90 font-medium">Click to queue</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="ml-2 shrink-0">
                                    <button onclick="addCurrentSuggestion()" aria-label="Add suggested track to queue" title="Add to Queue" class="px-2.5 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-medium transition-all shadow-md shadow-red-600/20 active:scale-95 flex items-center space-x-1">
                                        <i class="fa-solid fa-plus text-[10px]"></i>
                                        <span class="text-xs">Add</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            } else {
                currentSuggestion = null;
            }

            container.innerHTML = html;
        }

        function playQueueIndex(index) {
            if (index < 0 || index >= queue.length) return;
            currentIndex = index;
            const video = queue[currentIndex];
            showOverlay('hidden');

            if (isApiReady && player && typeof player.loadVideoById === 'function') {
                try {
                    player.loadVideoById({ 'videoId': video.id, 'suggestedQuality': 'large' });
                } catch (e) {
                    player.cueVideoById(video.id);
                }
            }
            saveQueueToStorage();
            renderQueue();
            updateCurrentVideoMetadata();
        }

        function handleVideoEnded() {
            if (currentIndex + 1 < queue.length) {
                playQueueIndex(currentIndex + 1);
            } else if (isLooping && queue.length > 0) {
                playQueueIndex(0);
            } else {
                document.getElementById('current-title').innerText = "Queue finished";
                document.getElementById('current-duration').innerText = "--:--";
                const timeEl = document.getElementById('current-time');
                if (timeEl) timeEl.innerText = "0:00";
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) progressBar.value = 0;
                document.getElementById('player-placeholder').style.opacity = '1';
            }
        }

        function playNext() {
            if (queue.length === 0) return;
            let nextIdx = currentIndex + 1;
            if (nextIdx >= queue.length) {
                if (isLooping) nextIdx = 0;
                else {
                    showToast("Reached end of queue", "info");
                    return;
                }
            }
            playQueueIndex(nextIdx);
        }

        function playPrevious() {
            if (queue.length === 0) return;
            let prevIdx = Math.max(0, currentIndex - 1);
            playQueueIndex(prevIdx);
        }

        function togglePlayPause() {
            if (!isApiReady || !player) return;
            try {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    if (currentIndex === -1 && queue.length > 0) {
                        playQueueIndex(0);
                    } else {
                        player.playVideo();
                    }
                }
            } catch (e) {
                retryPlayback();
            }
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loop-btn');
            if (isLooping) {
                btn.className = "w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-red-600/20 text-red-400 border border-red-500/30 flex items-center justify-center transition-all active:scale-95";
                showToast("Queue looping enabled", "success");
            } else {
                btn.className = "w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all active:scale-95";
                showToast("Queue looping disabled", "info");
            }
        }

        function setVolume(val) {
            if (isApiReady && player && player.setVolume) player.setVolume(val);
        }

        function toggleMute() {
            if (!isApiReady || !player) return;
            const muteBtn = document.getElementById('mute-btn');
            if (player.isMuted()) {
                player.unMute();
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high text-xs"></i>';
            } else {
                player.mute();
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark text-red-500 text-xs"></i>';
            }
        }

        function removeFromQueue(e, index) {
            e.stopPropagation();
            queue.splice(index, 1);
            if (index === currentIndex) {
                if (queue.length > 0) {
                    currentIndex = Math.min(index, queue.length - 1);
                    playQueueIndex(currentIndex);
                } else {
                    currentIndex = -1;
                    stopProgressTracking();
                    if (player && player.stopVideo) player.stopVideo();
                    document.getElementById('current-title').innerText = "No video playing";
                    document.getElementById('current-duration').innerText = "--:--";
                    const timeEl = document.getElementById('current-time');
                    if (timeEl) timeEl.innerText = "0:00";
                    const progressBar = document.getElementById('progress-bar');
                    if (progressBar) progressBar.value = 0;
                    document.getElementById('player-placeholder').style.opacity = '1';
                    saveQueueToStorage();
                    renderQueue();
                }
            } else {
                if (index < currentIndex) {
                    currentIndex--;
                }
                saveQueueToStorage();
                renderQueue();
            }
            showToast("Removed from queue", "info");
        }

        function moveQueueItem(e, fromIndex, toIndex) {
            e.stopPropagation();
            if (toIndex < 0 || toIndex >= queue.length) return;
            const item = queue.splice(fromIndex, 1)[0];
            queue.splice(toIndex, 0, item);
            if (currentIndex === fromIndex) currentIndex = toIndex;
            else if (fromIndex < currentIndex && toIndex >= currentIndex) currentIndex--;
            else if (fromIndex > currentIndex && toIndex <= currentIndex) currentIndex++;
            saveQueueToStorage();
            renderQueue();
        }

        function clearQueueCompletely() {
            if (queue.length === 0) return;
            if (!confirm(`Are you sure you want to clear all ${queue.length} video(s) from the queue?`)) {
                return;
            }
            recentlyClearedQueue = [...queue];
            queue = [];
            currentIndex = -1;
            stopProgressTracking();
            if (player && player.stopVideo) player.stopVideo();
            document.getElementById('current-title').innerText = "No video playing";
            document.getElementById('current-duration').innerText = "--:--";
            const timeEl = document.getElementById('current-time');
            if (timeEl) timeEl.innerText = "0:00";
            const progressBar = document.getElementById('progress-bar');
            if (progressBar) progressBar.value = 0;
            document.getElementById('player-placeholder').style.opacity = '1';
            showOverlay('hidden');
            saveQueueToStorage();
            renderQueue();
            showToast("Queue cleared.", "info", undoClearQueue, "Undo");
        }

        function undoClearQueue() {
            if (recentlyClearedQueue && recentlyClearedQueue.length > 0) {
                queue = [...recentlyClearedQueue];
                recentlyClearedQueue = null;
                currentIndex = 0;
                saveQueueToStorage();
                renderQueue();
                playQueueIndex(0);
                showToast("Queue restored!", "success");
            }
        }

        function loadSamplePlaylist() {
            let added = 0;
            for (const item of samplePlaylist) {
                if (!queue.some(q => q.id === item.id)) {
                    queue.push({ ...item, addedAt: Date.now() });
                    added++;
                }
            }
            saveQueueToStorage();
            renderQueue();
            if (currentIndex === -1 && queue.length > 0) {
                playQueueIndex(0);
            } else {
                showToast(added > 0 ? `Added ${added} demo tracks!` : "Demo tracks already in queue", "success");
            }
        }

        function updateCurrentVideoMetadata() {
            const placeholder = document.getElementById('player-placeholder');
            if (currentIndex >= 0 && queue[currentIndex]) {
                placeholder.style.opacity = '0';
                document.getElementById('current-title').innerText = queue[currentIndex].title;
                updatePlaybackProgress();
            } else {
                placeholder.style.opacity = '1';
                document.getElementById('current-title').innerText = "No video playing";
                document.getElementById('current-duration').innerText = "--:--";
                const timeEl = document.getElementById('current-time');
                if (timeEl) timeEl.innerText = "0:00";
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) progressBar.value = 0;
            }
        }

        function saveQueueToStorage() {
            try {
                localStorage.setItem('yt_queue_data', JSON.stringify({ queue, currentIndex }));
            } catch (e) {
                console.warn("Could not save to localStorage", e);
            }
        }

        function loadSavedQueue() {
            try {
                const saved = localStorage.getItem('yt_queue_data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.queue) && parsed.queue.length > 0) {
                        queue = parsed.queue;
                        currentIndex = (parsed.currentIndex >= 0 && parsed.currentIndex < queue.length) ? parsed.currentIndex : 0;
                        renderQueue();
                        if (isApiReady && player && player.cueVideoById && queue[currentIndex]) {
                            player.cueVideoById(queue[currentIndex].id);
                            updateCurrentVideoMetadata();
                            showOverlay('tap-to-play');
                        }
                    }
                }
            } catch (e) {
                console.warn("Could not load from localStorage", e);
            }
        }

        function exportQueue() {
            if (queue.length === 0) {
                showToast("Queue is empty", "info");
                return;
            }
            const blob = new Blob([JSON.stringify(queue, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = `youtube_queue_${Date.now()}.json`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast("Queue exported", "success");
        }

        function handleImportQueue(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        const validItems = imported.filter(item => item && extractVideoId(item.id));
                        if (validItems.length > 0) {
                            queue = validItems.map(item => ({
                                id: extractVideoId(item.id),
                                title: String(item.title || `YouTube Video (${item.id})`),
                                addedAt: Date.now()
                            }));
                            currentIndex = 0;
                            saveQueueToStorage();
                            renderQueue();
                            playQueueIndex(0);
                            showToast(`Imported ${validItems.length} videos!`, "success");
                        } else {
                            showToast("No valid videos found in JSON", "error");
                        }
                    }
                } catch (err) {
                    showToast("Invalid JSON file", "error");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function showToast(message, type = 'info', actionCallback = null, actionText = 'Undo') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = 'bg-slate-900/95 border-slate-800 text-slate-200';
            let icon = 'fa-circle-info text-blue-400';
            if (type === 'success') {
                bgClass = 'bg-emerald-950/95 border-emerald-800/80 text-emerald-200';
                icon = 'fa-circle-check text-emerald-400';
            } else if (type === 'error') {
                bgClass = 'bg-rose-950/95 border-rose-800/80 text-rose-200';
                icon = 'fa-triangle-exclamation text-rose-400';
            }
            toast.className = `flex items-center space-x-2.5 px-3.5 py-2.5 rounded-xl border shadow-xl backdrop-blur-md ${bgClass} text-xs font-medium pointer-events-auto transition-all duration-300 translate-y-2 opacity-0`;
            
            let actionHtml = '';
            if (actionCallback) {
                actionHtml = `<button type="button" class="ml-2 font-bold underline text-amber-400 hover:text-amber-300 transition-colors" id="toast-action-btn">${escapeHtml(actionText)}</button>`;
            }

            toast.innerHTML = `<i class="fa-solid ${icon} text-sm shrink-0"></i><span>${escapeHtml(message)}</span>${actionHtml}`;
            container.appendChild(toast);

            if (actionCallback) {
                const btn = toast.querySelector('#toast-action-btn');
                if (btn) {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        actionCallback();
                        toast.remove();
                    };
                }
            }

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, actionCallback ? 6000 : 3500);
        }
    </script>
</body>
</html>
