        function playQueueIndex(index) {
            if (index < 0 || index >= queue.length) return;
            currentIndex = index;
            const video = queue[currentIndex];
            showOverlay('hidden');

            if (isApiReady && player && typeof player.loadVideoById === 'function') {
                try {
                    player.loadVideoById({ 'videoId': video.id, 'suggestedQuality': 'large' });
                } catch (e) {
                    player.cueVideoById(video.id);
                }
            }
            saveQueueToStorage();
            updateSuggestionsList();
            renderQueue();
            updateCurrentVideoMetadata();

            // Pre-fetch live YouTube suggestions for current video, upcoming next track & queue end
            triggerLiveSuggestionFetch(video.id, video.title, video.author || '');
            if (currentIndex + 1 < queue.length) {
                const nxt = queue[currentIndex + 1];
                triggerLiveSuggestionFetch(nxt.id, nxt.title, nxt.author || '');
            }
            if (queue.length > 0) {
                const tail = queue[queue.length - 1];
                if (tail && tail.id !== video.id && (!queue[currentIndex + 1] || tail.id !== queue[currentIndex + 1].id)) {
                    triggerLiveSuggestionFetch(tail.id, tail.title, tail.author || '');
                }
            }
        }

        function handleVideoEnded() {
            if (currentIndex + 1 < queue.length) {
                playQueueIndex(currentIndex + 1);
            } else if (isLooping && queue.length > 0) {
                playQueueIndex(0);
            } else if (isAutoplayEnabled) {
                const autoPlayed = playAutoNextSuggestion();
                if (!autoPlayed) {
                    document.getElementById('current-title').innerText = "Queue finished";
                    document.getElementById('current-duration').innerText = "--:--";
                    const timeEl = document.getElementById('current-time');
                    if (timeEl) timeEl.innerText = "0:00";
                    const progressBar = document.getElementById('progress-bar');
                    if (progressBar) progressBar.value = 0;
                    document.getElementById('player-placeholder').style.opacity = '1';
                }
            } else {
                document.getElementById('current-title').innerText = "Queue finished";
                document.getElementById('current-duration').innerText = "--:--";
                const timeEl = document.getElementById('current-time');
                if (timeEl) timeEl.innerText = "0:00";
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) progressBar.value = 0;
                document.getElementById('player-placeholder').style.opacity = '1';
            }
        }

        function playNext() {
            if (queue.length === 0) return;
            let nextIdx = currentIndex + 1;
            if (nextIdx >= queue.length) {
                if (isLooping) {
                    nextIdx = 0;
                    playQueueIndex(nextIdx);
                } else if (isAutoplayEnabled) {
                    const autoPlayed = playAutoNextSuggestion();
                    if (!autoPlayed) {
                        showToast("Reached end of queue", "info");
                    }
                    return;
                } else {
                    showToast("Reached end of queue", "info");
                    return;
                }
            } else {
                playQueueIndex(nextIdx);
            }
        }

        function playPrevious() {
            if (queue.length === 0) return;
            let prevIdx = Math.max(0, currentIndex - 1);
            playQueueIndex(prevIdx);
        }

        function togglePlayPause() {
            if (!isApiReady || !player) return;
            try {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    if (currentIndex === -1 && queue.length > 0) {
                        playQueueIndex(0);
                    } else {
                        player.playVideo();
                    }
                }
            } catch (e) {
                retryPlayback();
            }
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = document.getElementById('loop-btn');
            if (isLooping) {
                btn.className = "w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-red-600/20 text-red-400 border border-red-500/30 flex items-center justify-center transition-all active:scale-95";
                showToast("Queue looping enabled", "success");
            } else {
                btn.className = "w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all active:scale-95";
                showToast("Queue looping disabled", "info");
            }
            renderQueue();
        }

        function toggleAutoplay() {
            isAutoplayEnabled = !isAutoplayEnabled;
            try {
                localStorage.setItem('yt_autoplay_enabled', JSON.stringify(isAutoplayEnabled));
            } catch (e) {}
            renderQueue();
            showToast(isAutoplayEnabled ? "Autoplay enabled" : "Autoplay disabled", "info");
        }

        function setVolume(val) {
            if (isApiReady && player && player.setVolume) player.setVolume(val);
        }

        function toggleMute() {
            if (!isApiReady || !player) return;
            const muteBtn = document.getElementById('mute-btn');
            if (player.isMuted()) {
                player.unMute();
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high text-xs"></i>';
            } else {
                player.mute();
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark text-red-500 text-xs"></i>';
            }
        }

        function removeFromQueue(e, index) {
            e.stopPropagation();
            queue.splice(index, 1);
            if (index === currentIndex) {
                if (queue.length > 0) {
                    currentIndex = Math.min(index, queue.length - 1);
                    playQueueIndex(currentIndex);
                } else {
                    currentIndex = -1;
                    stopProgressTracking();
                    if (player && player.stopVideo) player.stopVideo();
                    const playPauseIcon = document.getElementById('play-pause-icon');
                    const miniPlayIcon = document.getElementById('mini-play-icon');
                    const miniWave = document.getElementById('mini-wave');
                    if (playPauseIcon) playPauseIcon.className = "fa-solid fa-play ml-0.5 text-sm sm:text-base";
                    if (miniPlayIcon) miniPlayIcon.className = "fa-solid fa-play ml-0.5 text-xs";
                    if (miniWave) miniWave.classList.add('opacity-0');
                    updateCurrentVideoMetadata();
                    saveQueueToStorage();
                    renderQueue();
                }
            } else {
                if (index < currentIndex) {
                    currentIndex--;
                }
                saveQueueToStorage();
                updateSuggestionsList();
                renderQueue();
            }
            showToast("Removed from queue", "info");
        }

        function moveQueueItem(e, fromIndex, toIndex) {
            e.stopPropagation();
            if (toIndex < 0 || toIndex >= queue.length) return;
            const item = queue.splice(fromIndex, 1)[0];
            queue.splice(toIndex, 0, item);
            if (currentIndex === fromIndex) currentIndex = toIndex;
            else if (fromIndex < currentIndex && toIndex >= currentIndex) currentIndex--;
            else if (fromIndex > currentIndex && toIndex <= currentIndex) currentIndex++;
            saveQueueToStorage();
            renderQueue();
        }

        function clearQueueCompletely() {
            if (queue.length === 0) {
                try {
                    localStorage.removeItem('yt_queue_data');
                } catch (e) {}
                showToast("Queue is already empty", "info");
                return;
            }
            recentlyClearedQueue = [...queue];
            queue = [];
            currentIndex = -1;
            currentSuggestions = [];
            lastSuggestedVideoId = null;
            dismissedSuggestionIds.clear();
            stopProgressTracking();
            if (player && typeof player.stopVideo === 'function') {
                try {
                    player.stopVideo();
                } catch (e) {}
            }
            const playPauseIcon = document.getElementById('play-pause-icon');
            const miniPlayIcon = document.getElementById('mini-play-icon');
            const miniWave = document.getElementById('mini-wave');
            if (playPauseIcon) playPauseIcon.className = "fa-solid fa-play ml-0.5 text-sm sm:text-base";
            if (miniPlayIcon) miniPlayIcon.className = "fa-solid fa-play ml-0.5 text-xs";
            if (miniWave) miniWave.classList.add('opacity-0');
            showOverlay('hidden');
            updateCurrentVideoMetadata();
            saveQueueToStorage();
            renderQueue();
            showToast("Queue cleared.", "info", undoClearQueue, "Undo");
        }

        function undoClearQueue() {
            if (recentlyClearedQueue && recentlyClearedQueue.length > 0) {
                queue = [...recentlyClearedQueue];
                recentlyClearedQueue = null;
                currentIndex = 0;
                saveQueueToStorage();
                updateSuggestionsList();
                renderQueue();
                playQueueIndex(0);
                showToast("Queue restored!", "success");
            }
        }

        function loadSamplePlaylist() {
            let added = 0;
            for (const item of samplePlaylist) {
                if (!queue.some(q => q.id === item.id)) {
                    queue.push({ ...item, addedAt: Date.now() });
                    added++;
                }
            }
            saveQueueToStorage();
            updateSuggestionsList();
            renderQueue();
            if (currentIndex === -1 && queue.length > 0) {
                playQueueIndex(0);
            } else {
                showToast(added > 0 ? `Added ${added} demo tracks!` : "Demo tracks already in queue", "success");
            }
            if (queue.length > 0) {
                const tail = queue[queue.length - 1];
                triggerLiveSuggestionFetch(tail.id, tail.title, tail.author || '');
            }
        }

        function updateCurrentVideoMetadata() {
            const placeholder = document.getElementById('player-placeholder');
            const miniTitle = document.getElementById('mini-title');
            const miniThumbnail = document.getElementById('mini-thumbnail');
            const miniTimeEl = document.getElementById('mini-time');
            const miniDurEl = document.getElementById('mini-duration');

            if (currentIndex >= 0 && queue[currentIndex]) {
                placeholder.style.opacity = '0';
                document.getElementById('current-title').innerText = queue[currentIndex].title;
                if (miniTitle) miniTitle.innerText = queue[currentIndex].title;
                if (miniThumbnail) miniThumbnail.src = `https://img.youtube.com/vi/${queue[currentIndex].id}/hqdefault.jpg`;
                updatePlaybackProgress();
            } else {
                placeholder.style.opacity = '1';
                document.getElementById('current-title').innerText = "No video playing";
                document.getElementById('current-duration').innerText = "--:--";
                const timeEl = document.getElementById('current-time');
                if (timeEl) timeEl.innerText = "0:00";
                const progressBar = document.getElementById('progress-bar');
                if (progressBar) progressBar.value = 0;
                if (miniTitle) miniTitle.innerText = "No video playing";
                if (miniThumbnail) miniThumbnail.src = "https://placehold.co/120x90/1e293b/64748b?text=YT";
                if (miniTimeEl) miniTimeEl.innerText = "0:00";
                if (miniDurEl) miniDurEl.innerText = "--:--";
            }
            syncMobileMiniPlayerVisibility();
        }

        function saveQueueToStorage() {
            try {
                if (!queue || queue.length === 0) {
                    localStorage.removeItem('yt_queue_data');
                } else {
                    localStorage.setItem('yt_queue_data', JSON.stringify({ queue, currentIndex }));
                }
            } catch (e) {
                console.warn("Could not save to localStorage", e);
            }
        }

        function loadSavedQueue() {
            try {
                const saved = localStorage.getItem('yt_queue_data');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && Array.isArray(parsed.queue) && parsed.queue.length > 0) {
                        queue = parsed.queue;
                        currentIndex = (parsed.currentIndex >= 0 && parsed.currentIndex < queue.length) ? parsed.currentIndex : 0;
                        updateSuggestionsList();
                        renderQueue();
                        if (isApiReady && player && player.cueVideoById && queue[currentIndex]) {
                            player.cueVideoById(queue[currentIndex].id);
                            updateCurrentVideoMetadata();
                            showOverlay('tap-to-play');
                        }
                        if (queue.length > 0) {
                            const cur = queue[currentIndex] || queue[0];
                            triggerLiveSuggestionFetch(cur.id, cur.title, cur.author || '');
                            if (currentIndex + 1 < queue.length) {
                                const nxt = queue[currentIndex + 1];
                                triggerLiveSuggestionFetch(nxt.id, nxt.title, nxt.author || '');
                            }
                            const tail = queue[queue.length - 1];
                            if (tail && tail.id !== cur.id && (!queue[currentIndex + 1] || tail.id !== queue[currentIndex + 1].id)) {
                                triggerLiveSuggestionFetch(tail.id, tail.title, tail.author || '');
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn("Could not load from localStorage", e);
            }
        }

        function exportQueue() {
            if (queue.length === 0) {
                showToast("Queue is empty", "info");
                return;
            }
            const blob = new Blob([JSON.stringify(queue, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = `youtube_queue_${Date.now()}.json`;
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast("Queue exported", "success");
        }

        function handleImportQueue(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        const validItems = imported.filter(item => item && extractVideoId(item.id));
                        if (validItems.length > 0) {
                            queue = validItems.map(item => ({
                                id: extractVideoId(item.id),
                                title: String(item.title || `YouTube Video (${item.id})`),
                                author: String(item.author || ''),
                                duration: String(item.duration || ''),
                                addedAt: Date.now()
                            }));
                            currentIndex = 0;
                            saveQueueToStorage();
                            renderQueue();
                            playQueueIndex(0);
                            showToast(`Imported ${validItems.length} videos!`, "success");
                        } else {
                            showToast("No valid videos found in JSON", "error");
                        }
                    }
                } catch (err) {
                    showToast("Invalid JSON file", "error");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function showToast(message, type = 'info', actionCallback = null, actionText = 'Undo') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = 'bg-slate-900/95 border-slate-800 text-slate-200';
            let icon = 'fa-circle-info text-blue-400';
            if (type === 'success') {
                bgClass = 'bg-emerald-950/95 border-emerald-800/80 text-emerald-200';
                icon = 'fa-circle-check text-emerald-400';
            } else if (type === 'error') {
                bgClass = 'bg-rose-950/95 border-rose-800/80 text-rose-200';
                icon = 'fa-triangle-exclamation text-rose-400';
            }
            toast.className = `flex items-center space-x-2.5 px-3.5 py-2.5 rounded-xl border shadow-xl backdrop-blur-md ${bgClass} text-xs font-medium pointer-events-auto transition-all duration-300 translate-y-2 opacity-0`;
            
            let actionHtml = '';
            if (actionCallback) {
                actionHtml = `<button type="button" class="ml-2 font-bold underline text-amber-400 hover:text-amber-300 transition-colors" id="toast-action-btn">${escapeHtml(actionText)}</button>`;
            }

            toast.innerHTML = `<i class="fa-solid ${icon} text-sm shrink-0"></i><span>${escapeHtml(message)}</span>${actionHtml}`;
            container.appendChild(toast);

            if (actionCallback) {
                const btn = toast.querySelector('#toast-action-btn');
                if (btn) {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        actionCallback();
                        toast.remove();
                    };
                }
            }

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, actionCallback ? 6000 : 3500);
        }

        function scrollToQueue() {
            const queueEl = document.getElementById('queue-section');
            if (queueEl) {
                queueEl.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function scrollToPlayer() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function syncMobileMiniPlayerVisibility() {
            const miniPlayer = document.getElementById('mobile-mini-player');
            if (!miniPlayer) return;
            const isMobile = window.innerWidth < 768;
            const hasActiveVideo = currentIndex >= 0 && queue[currentIndex];
            const isScrolled = window.scrollY > 200;

            if (isMobile && hasActiveVideo && isScrolled) {
                miniPlayer.classList.remove('translate-y-28', 'opacity-0', 'pointer-events-none');
                miniPlayer.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
            } else {
                miniPlayer.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                miniPlayer.classList.add('translate-y-28', 'opacity-0', 'pointer-events-none');
            }
        }

        window.addEventListener('scroll', syncMobileMiniPlayerVisibility, { passive: true });
        window.addEventListener('resize', syncMobileMiniPlayerVisibility, { passive: true });

        // Initialize queue state immediately on page load
        loadSavedQueue();
        renderQueue();

        // App Version & Service Worker Management
        const APP_VERSION = 'v1.9.0';
        const versionText = document.getElementById('appVersionText');
        const versionBtn = document.getElementById('appVersionBtn');
        const updateBanner = document.getElementById('updateBanner');
        const updateBtn = document.getElementById('updateBtn');

        if (versionText) {
            versionText.textContent = APP_VERSION;
        }

        let swRegistration = null;

        function promptUserToUpdate(worker) {
            if (updateBanner) {
                updateBanner.classList.remove('hidden');
                updateBanner.classList.add('flex');
            }
            if (updateBtn) {
                updateBtn.onclick = () => {
                    if (worker) {
                        worker.postMessage({ type: 'SKIP_WAITING' });
                    }
                    window.location.reload();
                };
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        swRegistration = reg;
                        console.log('YT Queue Service Worker registered:', reg.scope);

                        // If a worker is already waiting
                        if (reg.waiting && navigator.serviceWorker.controller) {
                            promptUserToUpdate(reg.waiting);
                        }

                        // Listen for newly installed updates
                        reg.addEventListener('updatefound', () => {
                            const installingWorker = reg.installing;
                            if (!installingWorker) return;

                            installingWorker.addEventListener('statechange', () => {
                                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    promptUserToUpdate(installingWorker);
                                }
                            });
                        });
                    })
                    .catch((err) => {
                        console.warn('Service Worker registration failed:', err);
                    });

                let isRefreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!isRefreshing) {
                        isRefreshing = true;
                        window.location.reload();
                    }
                });
            });

            // Manual update check on version button click
            if (versionBtn) {
                versionBtn.addEventListener('click', async () => {
                    const originalText = versionText ? versionText.textContent : APP_VERSION;
                    if (versionText) versionText.textContent = 'Checking...';
                    try {
                        if (swRegistration) {
                            await swRegistration.update();
                        } else {
                            const reg = await navigator.serviceWorker.getRegistration();
                            if (reg) await reg.update();
                        }
                        if (typeof showToast === 'function') {
                            showToast('Checked for updates', 'info');
                        }
                        setTimeout(() => {
                            if (versionText) versionText.textContent = originalText;
                        }, 1200);
                    } catch (e) {
                        console.warn('Manual update check failed:', e);
                        if (versionText) versionText.textContent = originalText;
                    }
                });
            }
        }
    </script>
</body>
